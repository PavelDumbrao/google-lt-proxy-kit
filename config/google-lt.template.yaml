# Профиль Clash Verge Rev: сервисы Google и Claude (Claude Code, Claude Desktop, claude.ai)
# через литовский прокси, остальное напрямую.
# Агент подставляет HOST, PORT, LOGIN, PASSWORD из файла прокси ученика.
# Готовый файл с паролем НЕ публиковать и НЕ коммитить.

mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.ntp.org"
  default-nameserver:
    - 77.88.8.8
    - 8.8.8.8
  nameserver:
    - 77.88.8.8
    - 8.8.8.8

proxies:
  - name: LT
    type: socks5
    server: HOST
    port: PORT
    username: LOGIN
    password: PASSWORD
    udp: false

proxy-groups:
  - name: GOOGLE
    type: select
    proxies:
      - LT
  - name: CLAUDE
    type: select
    proxies:
      - LT

rules:
  # QUIC (UDP 443) не проходит через этот прокси: браузер сам перейдёт на обычный TCP.
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # Google, Gemini, NotebookLM, AI Studio, Antigravity, вход в аккаунт
  - DOMAIN-SUFFIX,google.com,GOOGLE
  - DOMAIN-SUFFIX,google,GOOGLE
  - DOMAIN-SUFFIX,goog,GOOGLE
  - DOMAIN-SUFFIX,googleapis.com,GOOGLE
  - DOMAIN-SUFFIX,gstatic.com,GOOGLE
  - DOMAIN-SUFFIX,googleusercontent.com,GOOGLE
  - DOMAIN-SUFFIX,google.dev,GOOGLE
  - DOMAIN-SUFFIX,googleblog.com,GOOGLE
  - DOMAIN-SUFFIX,googlesyndication.com,GOOGLE
  - DOMAIN-SUFFIX,googletagmanager.com,GOOGLE
  - DOMAIN-SUFFIX,google-analytics.com,GOOGLE
  - DOMAIN-SUFFIX,ggpht.com,GOOGLE
  - DOMAIN-SUFFIX,gvt1.com,GOOGLE
  - DOMAIN-SUFFIX,gvt2.com,GOOGLE
  - DOMAIN-SUFFIX,gvt3.com,GOOGLE
  - DOMAIN-SUFFIX,withgoogle.com,GOOGLE
  - DOMAIN-SUFFIX,recaptcha.net,GOOGLE
  - DOMAIN-SUFFIX,1e100.net,GOOGLE
  # Claude Code, Claude Desktop, claude.ai, вход в аккаунт Anthropic
  - DOMAIN-SUFFIX,anthropic.com,CLAUDE
  - DOMAIN-SUFFIX,claude.ai,CLAUDE
  - DOMAIN-SUFFIX,claude.com,CLAUDE
  - DOMAIN-SUFFIX,claudeusercontent.com,CLAUDE
  # Всё остальное, включая YouTube, — напрямую (прокси общий, видео забьёт канал).
  - MATCH,DIRECT
